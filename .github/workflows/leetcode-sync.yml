name: LeetCode Auto Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
        run: |
          cat > sync_leetcode.py <<'PY'
          import os
          import json
          import re
          import subprocess
          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          LEETCODE_GRAPHQL = "https://leetcode.com/graphql"

          LEETCODE_USERNAME = "Kartikeyan_Suresh"

          SESSION = os.environ["LEETCODE_SESSION"]
          CSRF = os.environ["LEETCODE_CSRF_TOKEN"]
          COMMIT_EMAIL = os.environ["GIT_COMMIT_EMAIL"]


          # ============================================================
          # HTTP CONFIGURATION
          # ============================================================

          HEADERS = {
              "Content-Type": "application/json",
              "Origin": "https://leetcode.com",
              "Referer": "https://leetcode.com/",
              "X-CSRFToken": CSRF,
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/154.0.0.0 Safari/537.36"
              ),
          }

          COOKIES = {
              "LEETCODE_SESSION": SESSION,
              "csrftoken": CSRF,
          }


          # ============================================================
          # GRAPHQL REQUEST
          # ============================================================

          def graphql(query, variables=None):

              response = requests.post(
                  LEETCODE_GRAPHQL,
                  headers=HEADERS,
                  cookies=COOKIES,
                  json={
                      "query": query,
                      "variables": variables or {},
                  },
                  timeout=30,
              )

              # Print response when LeetCode rejects request.
              if response.status_code != 200:

                  print()
                  print("LeetCode HTTP error:")
                  print(response.status_code)
                  print(response.text)
                  print()

                  response.raise_for_status()


              data = response.json()

              if data.get("errors"):

                  raise RuntimeError(
                      json.dumps(
                          data["errors"],
                          indent=2
                      )
                  )

              if "data" not in data:

                  raise RuntimeError(
                      "LeetCode returned no GraphQL data."
                  )

              return data["data"]


          # ============================================================
          # GET RECENT ACCEPTED SUBMISSIONS
          # ============================================================

          def get_recent_accepted_submissions():

              query = """
              query recentAcSubmissions(
                  $username: String!,
                  $limit: Int!
              ) {
                  recentAcSubmissionList(
                      username: $username,
                      limit: $limit
                  ) {
                      id
                      title
                      titleSlug
                      timestamp
                      lang
                      statusDisplay
                  }
              }
              """

              data = graphql(
                  query,
                  {
                      "username": LEETCODE_USERNAME,
                      "limit": 20,
                  }
              )

              return data.get(
                  "recentAcSubmissionList",
                  []
              )


          # ============================================================
          # GET SUBMISSION SOURCE CODE
          # ============================================================

          def get_submission_code(submission_id):

              query = """
              query submissionDetail($id: ID!) {
                  submissionDetail(submissionId: $id) {
                      id
                      code
                      runtime
                      memory
                      rawMemory
                      statusDisplay
                      timestamp
                      lang
                      passedTestCaseCnt
                      totalTestCaseCnt
                      sourceUrl
                      question {
                          titleSlug
                          title
                          translatedTitle
                          questionId
                          questionFrontendId
                      }
                  }
              }
              """

              data = graphql(
                  query,
                  {
                      "id": str(submission_id),
                  }
              )

              submission = data.get(
                  "submissionDetail"
              )

              if not submission:
                  return None

              return submission


          # ============================================================
          # SAFE FOLDER NAME
          # ============================================================

          def safe_name(value):

              value = value.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  value
              )

              value = value.strip("-")

              return value


          # ============================================================
          # LANGUAGE EXTENSIONS
          # ============================================================

          def language_extension(lang):

              mapping = {
                  "cpp": "cpp",
                  "c++": "cpp",
                  "python": "py",
                  "python3": "py",
                  "java": "java",
                  "javascript": "js",
                  "typescript": "ts",
                  "c": "c",
                  "csharp": "cs",
                  "kotlin": "kt",
                  "go": "go",
                  "rust": "rs",
                  "swift": "swift",
                  "php": "php",
                  "ruby": "rb",
              }

              return mapping.get(
                  lang.lower(),
                  "txt"
              )


          # ============================================================
          # LOAD SYNCED SUBMISSION IDS
          # ============================================================

          def load_synced_submissions():

              directory = (
                  ".leetcode-sync/submissions"
              )

              if not os.path.exists(directory):
                  return set()

              return {
                  filename[:-5]
                  for filename in os.listdir(directory)
                  if filename.endswith(".json")
              }


          # ============================================================
          # GIT HELPER
          # ============================================================

          def git(*args):

              subprocess.run(
                  ["git", *args],
                  check=True
              )


          # ============================================================
          # COMMIT ONE SUBMISSION
          # ============================================================

          def commit_submission(
              submission_id,
              title,
              slug,
              code,
              lang,
              timestamp,
              runtime,
              memory,
          ):

              print()
              print("=" * 70)
              print(
                  f"Creating Git commit for submission "
                  f"{submission_id}"
              )
              print(
                  f"Problem: {title}"
              )
              print("=" * 70)


              # --------------------------------------------------------
              # Problem number
              # --------------------------------------------------------

              problem_number = ""

              match = re.search(
                  r"^\d+",
                  title
              )

              if match:
                  problem_number = match.group()


              # --------------------------------------------------------
              # Unique submission record
              # --------------------------------------------------------

              submission_dir = (
                  ".leetcode-sync/submissions"
              )

              os.makedirs(
                  submission_dir,
                  exist_ok=True
              )

              metadata = {
                  "submission_id": str(
                      submission_id
                  ),
                  "problem": title,
                  "slug": slug,
                  "language": lang,
                  "timestamp": timestamp,
                  "runtime": runtime,
                  "memory": memory,
              }

              metadata_path = (
                  f"{submission_dir}/"
                  f"{submission_id}.json"
              )

              with open(
                  metadata_path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      metadata,
                      file,
                      indent=2,
                      ensure_ascii=False
                  )


              # --------------------------------------------------------
              # Problem folder
              # --------------------------------------------------------

              if problem_number:

                  folder = (
                      f"{problem_number}-"
                      f"{safe_name(slug)}"
                  )

              else:

                  folder = safe_name(slug)


              os.makedirs(
                  folder,
                  exist_ok=True
              )


              # --------------------------------------------------------
              # Solution file
              # --------------------------------------------------------

              extension = (
                  language_extension(lang)
              )

              solution_path = (
                  f"{folder}/"
                  f"solution.{extension}"
              )

              with open(
                  solution_path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(code)


              # --------------------------------------------------------
              # README
              # --------------------------------------------------------

              readme_path = (
                  f"{folder}/README.md"
              )

              with open(
                  readme_path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(
                      f"# {title}\n\n"
                      f"- LeetCode: "
                      f"https://leetcode.com/problems/"
                      f"{slug}/\n"
                      f"- Language: `{lang}`\n"
                      f"- Submission ID: "
                      f"`{submission_id}`\n"
                      f"- Runtime: `{runtime}`\n"
                      f"- Memory: `{memory}`\n"
                      f"- Submitted: `{timestamp}`\n"
                  )


              # --------------------------------------------------------
              # Git identity
              # --------------------------------------------------------

              git(
                  "config",
                  "user.name",
                  "Kartikeyan-2703"
              )

              git(
                  "config",
                  "user.email",
                  COMMIT_EMAIL
              )


              # --------------------------------------------------------
              # Stage only this submission
              # --------------------------------------------------------

              git(
                  "add",
                  metadata_path,
                  solution_path,
                  readme_path
              )


              # --------------------------------------------------------
              # Check for changes
              # --------------------------------------------------------

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if result.returncode == 0:

                  print(
                      f"No changes for submission "
                      f"{submission_id}"
                  )

                  return False


              # --------------------------------------------------------
              # ONE COMMIT
              # --------------------------------------------------------

              commit_message = (
                  f"LeetCode: {title} "
                  f"(submission {submission_id})"
              )

              git(
                  "commit",
                  "-m",
                  commit_message
              )


              # --------------------------------------------------------
              # PUSH
              # --------------------------------------------------------

              git(
                  "push",
                  "origin",
                  "HEAD:main"
              )

              print()
              print(
                  f"SUCCESS: {commit_message}"
              )
              print()

              return True


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print()
              print("=" * 70)
              print("LEETCODE AUTO SYNC")
              print("=" * 70)

              print(
                  f"LeetCode username: "
                  f"{LEETCODE_USERNAME}"
              )

              print(
                  "Fetching recent accepted "
                  "LeetCode submissions..."
              )

              submissions = (
                  get_recent_accepted_submissions()
              )

              print(
                  f"Found {len(submissions)} "
                  f"recent accepted submissions."
              )


              synced = (
                  load_synced_submissions()
              )

              print(
                  f"Already synced submissions: "
                  f"{len(synced)}"
              )


              # Oldest first.
              submissions = sorted(
                  submissions,
                  key=lambda item: int(
                      item["timestamp"]
                  )
              )


              new_commits = 0


              for submission in submissions:

                  submission_id = str(
                      submission["id"]
                  )


                  # ----------------------------------------------------
                  # IMPORTANT:
                  #
                  # We only skip the EXACT same submission ID.
                  #
                  # We do NOT skip based on problem.
                  #
                  # Therefore re-solving an old problem works.
                  # ----------------------------------------------------

                  if submission_id in synced:

                      print(
                          f"Already synced: "
                          f"{submission_id} "
                          f"- {submission['title']}"
                      )

                      continue


                  print()
                  print(
                      f"Processing: "
                      f"{submission_id} "
                      f"- {submission['title']}"
                  )


                  # ----------------------------------------------------
                  # Get code
                  # ----------------------------------------------------

                  details = (
                      get_submission_code(
                          submission_id
                      )
                  )


                  if not details:

                      print(
                          f"Could not retrieve "
                          f"submission {submission_id}"
                      )

                      continue


                  # ----------------------------------------------------
                  # Safety check
                  # ----------------------------------------------------

                  if (
                      details.get(
                          "statusDisplay"
                      )
                      != "Accepted"
                  ):

                      print(
                          f"Skipping non-accepted "
                          f"submission {submission_id}"
                      )

                      continue


                  # ----------------------------------------------------
                  # Create exactly ONE commit
                  # ----------------------------------------------------

                  committed = commit_submission(

                      submission_id,
                      submission["title"],
                      submission["titleSlug"],
                      details["code"],
                      details["lang"],
                      details["timestamp"],
                      details.get("runtime"),
                      details.get("memory"),
                  )


                  if committed:
                      new_commits += 1


              print()
              print("=" * 70)
              print("SYNC COMPLETE")
              print("=" * 70)
              print(
                  f"New Git commits: "
                  f"{new_commits}"
              )
              print("=" * 70)


          if __name__ == "__main__":
              main()

          PY

          python sync_leetcode.py
